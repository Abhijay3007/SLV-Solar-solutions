<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Mounting Rod -->
  <rect x="244" y="0" width="12" height="150" fill="url(#bodyGrad)" />
  <rect x="238" y="145" width="24" height="20" rx="3" fill="#94a3b8" />

  <!-- Blades Group with rotation shadow -->
  <g filter="url(#shadow)">
    
    <!-- Blade 1 (Left-pointing slightly down) -->
    <g transform="translate(250, 220) rotate(-15)">
      <path d="M 0,-16 C 50,-18 160,-22 200,-15 C 215,-10 215,10 200,15 C 160,22 50,18 0,16 Z" fill="url(#bladeGrad)" stroke="#cbd5e1" stroke-width="0.5" />
      <!-- Aero ridges -->
      <path d="M 40,-6 L 170,-6 M 40,6 L 170,6" stroke="#f1f5f9" stroke-width="2" />
    </g>

    <!-- Blade 2 (Rotated 120deg) -->
    <g transform="translate(250, 220) rotate(105)">
      <path d="M 0,-16 C 50,-18 160,-22 200,-15 C 215,-10 215,10 200,15 C 160,22 50,18 0,16 Z" fill="url(#bladeGrad)" stroke="#cbd5e1" stroke-width="0.5" />
      <path d="M 40,-6 L 170,-6 M 40,6 L 170,6" stroke="#f1f5f9" stroke-width="2" />
    </g>

    <!-- Blade 3 (Rotated 240deg) -->
    <g transform="translate(250, 220) rotate(225)">
      <path d="M 0,-16 C 50,-18 160,-22 200,-15 C 215,-10 215,10 200,15 C 160,22 50,18 0,16 Z" fill="url(#bladeGrad)" stroke="#cbd5e1" stroke-width="0.5" />
      <path d="M 40,-6 L 170,-6 M 40,6 L 170,6" stroke="#f1f5f9" stroke-width="2" />
    </g>

  </g>

  <!-- Central Engine Dome Assembly -->
  <g transform="translate(250, 220)" filter="url(#shadow)">
    <!-- Base plate -->
    <circle cx="0" cy="0" r="48" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Gold Trim accent circle -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Inner dome -->
    <circle cx="0" cy="0" r="30" fill="#ffffff" />
    
    <!-- LED center glowing area -->
    <circle cx="0" cy="0" r="16" fill="#fef08a" opacity="0.8" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    
    <!-- Subtle glare reflection -->
    <path d="M -20,-10 A 24 24 0 0 1 10,-20" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>

</svg>
