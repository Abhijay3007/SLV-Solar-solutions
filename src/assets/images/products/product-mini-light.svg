<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" /> <!-- Emerald green product theme -->
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" /> <!-- warm lit bulb -->
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground reflection shadow -->
  <ellipse cx="250" cy="420" rx="90" ry="10" fill="#475569" opacity="0.25" />

  <!-- Carrying Handle (Arc) -->
  <path d="M 180,180 C 180,100 320,100 320,180" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />
  <path d="M 180,180 C 180,100 320,100 320,180" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

  <!-- Lantern Body Base assembly -->
  <g filter="url(#shadow)">
    <!-- Base block -->
    <path d="M 160,370 L 340,370 L 325,410 L 175,410 Z" fill="url(#bodyGrad)" stroke="#064e3b" stroke-width="2" />
    <!-- Ground rubber bumper -->
    <rect x="180" y="410" width="140" height="8" rx="2" fill="#1e293b" />
    
    <!-- Top shoulder cap -->
    <path d="M 175,175 L 325,175 L 340,215 L 160,215 Z" fill="url(#bodyGrad)" stroke="#064e3b" stroke-width="2" />
    <!-- Integrated Solar Panel on Top shoulder cap -->
    <polygon points="210,185 290,185 300,205 200,205" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    
    <!-- Glass/Lens cylindrical compartment -->
    <rect x="176" y="215" width="148" height="155" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <!-- Glow texture -->
    <rect x="180" y="220" width="140" height="145" rx="2" fill="url(#lensGrad)" opacity="0.85" />
    
    <!-- Protective Steel Pillars/Cage -->
    <rect x="176" y="215" width="8" height="155" fill="#64748b" />
    <rect x="316" y="215" width="8" height="155" fill="#64748b" />
    <rect x="246" y="215" width="8" height="155" fill="#64748b" opacity="0.3" />
    
    <!-- Internal glowing LED filament -->
    <line x1="250" y1="230" x2="250" y2="350" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <circle cx="250" cy="290" r="15" fill="#ffffff" filter="url(#shadow)" />
    
    <!-- Power Button (Solar Orange Toggle) -->
    <rect x="235" y="380" width="30" height="14" rx="2" fill="#f97316" stroke="#ea580c" stroke-width="1" />
    <circle cx="242" cy="387" r="4" fill="#ffffff" />
  </g>

</svg>
