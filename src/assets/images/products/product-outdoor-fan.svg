<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="180" fill="url(#glowGrad)" />

  <!-- Solar Panel Indicator (Stand Attached) -->
  <g transform="translate(320, 260) rotate(-15)" filter="url(#dropShadow)">
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <grid x="-40" y="-30" width="80" height="60">
      <path d="M -40,-10 L 40,-10 M -40,10 L 40,10 M -20,-30 L -20,30 M 0,-30 L 0,30 M 20,-30 L 20,30" stroke="#38bdf8" stroke-width="1" />
    </grid>
    <rect x="-4" y="30" width="8" height="40" fill="#475569" />
  </g>

  <!-- Fan Base & Stand -->
  <g filter="url(#dropShadow)">
    <!-- Base Plate -->
    <ellipse cx="250" cy="440" rx="90" ry="18" fill="url(#metalGrad)" />
    <!-- Stand Pole -->
    <rect x="242" y="240" width="16" height="200" fill="url(#metalGrad)" />
    <rect x="238" y="330" width="24" height="12" rx="2" fill="#d97706" /> <!-- Speed Switch Box -->
  </g>

  <!-- Fan Head Assembly -->
  <g transform="translate(250, 180)" filter="url(#dropShadow)">
    <!-- Rear Motor Housing -->
    <circle cx="0" cy="0" r="45" fill="url(#metalGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Fan Blades (Rotating Graphic) -->
    <g>
      <!-- Blade 1 -->
      <path d="M -10,0 C -35,-80 -15,-120 0,-120 C 15,-120 35,-80 10,0 Z" fill="url(#bladeGrad)" opacity="0.9" />
      <!-- Blade 2 (Rotated 120deg) -->
      <g transform="rotate(120)">
        <path d="M -10,0 C -35,-80 -15,-120 0,-120 C 15,-120 35,-80 10,0 Z" fill="url(#bladeGrad)" opacity="0.9" />
      </g>
      <!-- Blade 3 (Rotated 240deg) -->
      <g transform="rotate(240)">
        <path d="M -10,0 C -35,-80 -15,-120 0,-120 C 15,-120 35,-80 10,0 Z" fill="url(#bladeGrad)" opacity="0.9" />
      </g>
    </g>

    <!-- Center Hub Cap -->
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
    <circle cx="0" cy="0" r="10" fill="#f59e0b" />

    <!-- External Safety Grill Spokes (Radial Lines) -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.75" />
    <circle cx="0" cy="0" r="142" fill="none" stroke="url(#metalGrad)" stroke-width="4" />
    
    <!-- Outer rim glow reflection -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="100 200" opacity="0.4" />
    
    <path d="M 0,-140 L 0,140 M -140,0 L 140,0 M -100,-100 L 100,100 M -100,100 L 100,-100" stroke="#64748b" stroke-width="0.75" opacity="0.5" />
    
    <!-- Concentric Grill Rings -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#64748b" stroke-width="0.75" opacity="0.5" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#64748b" stroke-width="0.75" opacity="0.5" />
  </g>

  <!-- Green Battery Status LED -->
  <circle cx="250" cy="310" r="4" fill="#10b981" />
</svg>
