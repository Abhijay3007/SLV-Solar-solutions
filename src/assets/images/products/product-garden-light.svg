<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#eab308" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="lightSpread" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="20%" stop-color="#eab308" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Ground surface shadow -->
  <ellipse cx="250" cy="450" rx="120" ry="12" fill="#020617" opacity="0.8" />
  
  <!-- Ground Grass background -->
  <path d="M 100,450 C 150,445 200,448 250,446 C 300,444 350,449 400,445 C 450,442 480,448 500,450 L 500,500 L 0,500 L 0,450 Z" fill="#064e3b" opacity="0.3" />

  <!-- Solar light cone glow (Large backdrop layer) -->
  <polygon points="120,440 210,190 290,190 380,440" fill="url(#glowGrad)" />

  <!-- Radial halo aura -->
  <circle cx="250" cy="210" r="100" fill="url(#lightSpread)" filter="url(#blur)" />

  <!-- Stainless Steel Cap Assembly -->
  <!-- Solar Lid -->
  <path d="M 190,120 C 190,120 220,112 250,112 C 280,112 310,120 310,120 L 320,135 C 320,135 285,128 250,128 C 215,128 180,135 180,135 Z" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1" />
  <!-- Solar panel embedded in cap (Top angle view) -->
  <ellipse cx="250" cy="120" rx="35" ry="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <line x1="250" y1="115" x2="250" y2="125" stroke="#38bdf8" stroke-width="0.5" />

  <!-- Glass Lamp Chamber -->
  <rect x="204" y="135" width="92" height="60" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
  <rect x="220" y="135" width="60" height="60" fill="#ffffff" opacity="0.75" />
  <!-- Glass refraction lines -->
  <line x1="225" y1="135" x2="225" y2="195" stroke="#cbd5e1" stroke-width="1" opacity="0.5" />
  <line x1="275" y1="135" x2="275" y2="195" stroke="#cbd5e1" stroke-width="1" opacity="0.5" />
  <!-- Internal LED bulb fixture -->
  <circle cx="250" cy="148" r="6" fill="#ffffff" />
  <polygon points="248,135 252,135 253,145 247,145" fill="#94a3b8" />

  <!-- Stainless Steel Stem / Pole -->
  <rect x="240" y="195" width="20" height="230" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1" />

  <!-- Connection Joint ring -->
  <rect x="236" y="195" width="28" height="10" rx="1.5" fill="url(#bodyGrad)" stroke="#475569" stroke-width="0.75" />
  
  <!-- Ground Stake coupler -->
  <rect x="238" y="420" width="24" height="22" rx="1" fill="#1e293b" />

</svg>
