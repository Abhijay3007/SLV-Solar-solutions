<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" style="background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);">
  <defs>
    <!-- Brushed Metal Gradient for Downrod and Hub -->
    <linearGradient id="brushedMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="15%" stop-color="#a0aec0" />
      <stop offset="35%" stop-color="#edf2f7" />
      <stop offset="55%" stop-color="#cbd5e0" />
      <stop offset="85%" stop-color="#718096" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <!-- Metal Specular/Vertical Highlight (for cylindrical pieces) -->
    <linearGradient id="metalVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="45%" stop-color="#edf2f7" />
      <stop offset="55%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>

    <!-- Mahogany/Walnut Wood Blade Primary Gradient -->
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c3621" />
      <stop offset="30%" stop-color="#462512" />
      <stop offset="60%" stop-color="#512c17" />
      <stop offset="80%" stop-color="#3c1d0c" />
      <stop offset="100%" stop-color="#220e04" />
    </linearGradient>

    <!-- Wood Blade Highlights and shading (Blade 1 - Top Left) -->
    <linearGradient id="woodBlade1" x1="0.3" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#77452a" />
      <stop offset="45%" stop-color="#512c17" />
      <stop offset="85%" stop-color="#3c1d0c" />
      <stop offset="100%" stop-color="#1b0a03" />
    </linearGradient>

    <!-- Wood Blade Highlights and shading (Blade 2 - Mid Right) -->
    <linearGradient id="woodBlade2" x1="0.1" y1="0.3" x2="0.9" y2="0.6">
      <stop offset="0%" stop-color="#7d4c30" />
      <stop offset="35%" stop-color="#512c17" />
      <stop offset="70%" stop-color="#3d1d0c" />
      <stop offset="100%" stop-color="#200d04" />
    </linearGradient>

    <!-- Wood Blade Highlights and shading (Blade 3 - Bottom Left) -->
    <linearGradient id="woodBlade3" x1="0.2" y1="0.8" x2="0.8" y2="0.2">
      <stop offset="0%" stop-color="#321507" />
      <stop offset="50%" stop-color="#502c17" />
      <stop offset="85%" stop-color="#693d24" />
      <stop offset="100%" stop-color="#220e04" />
    </linearGradient>

    <!-- Glowing Center LED Gradient -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fffff0" />
      <stop offset="80%" stop-color="#fefcbf" />
      <stop offset="100%" stop-color="#cbd5e0" />
    </radialGradient>

    <!-- Light Shadow Filter for 3D realism -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>

    <!-- Soft light emission bloom -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Reflection on Ceiling/Background -->
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
    <stop offset="60%" stop-color="#e2e8f0" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
  </radialGradient>
  <circle cx="280" cy="300" r="280" fill="url(#bgGlow)" />

  <!-- 1. Silver Downrod (Extends from ceiling to motor cap) -->
  <rect x="288" y="0" width="16" height="240" fill="url(#brushedMetal)" />
  <!-- Shadow on Downrod -->
  <rect x="298" y="0" width="6" height="240" fill="#2d3748" opacity="0.15" />

  <!-- Downrod Collar / Coupling (at the base of the rod) -->
  <path d="M 280,240 L 312,240 L 306,215 L 286,215 Z" fill="url(#brushedMetal)" stroke="#718096" stroke-width="0.5" />

  <!-- 2. Sculpted Motor Upper Housing (Brushed Metal) -->
  <path d="M 270,240 C 270,240 264,285 248,310 L 344,310 C 328,285 322,240 322,240 Z" fill="url(#brushedMetal)" />
  <!-- Upper Housing Highlight / Curvature Line -->
  <path d="M 252,300 C 270,265 322,265 340,300" fill="none" stroke="#edf2f7" stroke-width="1.5" opacity="0.4" />

  <!-- Main Fan Assembly Group (Applying Drop Shadow for Depth) -->
  <g filter="url(#dropShadow)">

    <!-- 3. Sculpted Proprietary Wooden Blades -->
    <!-- Blade 1 (Top Left, sweeping back & up) -->
    <path d="M 248,315 
             C 210,295 185,250 148,225 
             C 120,205 90,195 72,192 
             C 70,192 68,195 70,198
             C 85,215 110,238 128,260 
             C 160,300 200,345 220,380
             C 230,398 238,400 242,402
             C 246,400 248,390 248,375 Z" 
          fill="url(#woodBlade1)" />
          
    <!-- Blade 1 Wood Grain Accent Line -->
    <path d="M 85,198 C 110,215 145,255 185,310 C 215,350 230,378 235,385" 
          fill="none" stroke="#361a0d" stroke-width="2" opacity="0.45" />
    <path d="M 76,194 C 95,206 130,240 170,290 C 205,335 222,368 226,375" 
          fill="none" stroke="#7e4f35" stroke-width="1" opacity="0.3" />


    <!-- Blade 2 (Mid-Right, sweeping outward horizontally) -->
    <path d="M 334,315
             C 380,314 430,335 480,344 
             C 525,352 570,354 595,355
             C 598,355 598,358 595,360
             C 565,372 525,386 480,395
             C 410,409 350,420 305,420
             C 285,420 270,412 260,398
             C 285,380 325,330 334,315 Z" 
          fill="url(#woodBlade2)" />

    <!-- Blade 2 Wood Grain Accent Line -->
    <path d="M 345,330 C 390,335 445,352 500,361 C 540,368 580,370 590,370" 
          fill="none" stroke="#361a0d" stroke-width="2" opacity="0.45" />
    <path d="M 370,344 C 410,348 460,362 510,370" 
          fill="none" stroke="#7e4f35" stroke-width="1" opacity="0.3" />


    <!-- Blade 3 (Bottom-Left, sweeping forward & down) -->
    <path d="M 230,395
             C 225,410 200,455 180,475
             C 160,495 135,520 115,532
             C 112,534 110,532 112,528
             C 120,500 135,465 152,430
             C 180,375 224,330 248,310
             C 255,305 264,308 266,312
             C 264,320 252,360 230,395 Z" 
          fill="url(#woodBlade3)" stroke="#220e04" stroke-width="0.25" />

    <!-- Blade 3 Wood Grain Accent Line -->
    <path d="M 248,328 C 235,355 208,405 182,448 C 158,485 135,512 120,526" 
          fill="none" stroke="#1d0c04" stroke-width="2" opacity="0.5" />
    <path d="M 254,322 C 242,348 216,396 190,440" 
          fill="none" stroke="#7e4f35" stroke-width="1.2" opacity="0.3" />


    <!-- 4. Center Wood Hub Joint (Smooth intersection of 3 blades) -->
    <!-- This forms the continuous sculpted look wrapping the light kit -->
    <path d="M 238,335 C 235,310 270,300 292,305 C 315,310 338,315 330,335 C 322,355 315,385 292,400 C 270,412 245,398 238,360 Z" 
          fill="url(#woodBase)" />

    <!-- Highlight on Wood Hub Joint to define organic curves -->
    <path d="M 252,324 C 270,314 290,314 308,320" fill="none" stroke="#8c5839" stroke-width="1.5" opacity="0.4" />
    <path d="M 242,352 C 255,372 268,390 288,394" fill="none" stroke="#1b0801" stroke-width="2" opacity="0.6" />

    <!-- 5. Lower Light Kit Outer Ring (Brushed Metal) -->
    <!-- Lower housing which holds the circular glass dome -->
    <ellipse cx="288" cy="385" rx="63" ry="25" fill="none" stroke="#2d3748" stroke-width="2" />
    <ellipse cx="288" cy="384" rx="62" ry="24" fill="url(#brushedMetal)" />
    <!-- Metallic Inner lip -->
    <ellipse cx="288" cy="384" rx="54" ry="20" fill="#718096" stroke="#4a5568" stroke-width="0.5" />

    <!-- 6. Glowing LED Glass Dome (Warm light emanating) -->
    <ellipse cx="288" cy="386" rx="50" ry="17" fill="url(#ledGlow)" filter="url(#bloom)" />
    <!-- Glass Lens shadow/rim border -->
    <ellipse cx="288" cy="386" rx="50" ry="17" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.75" />

    <!-- Glass Dome Lens Reflection Glare -->
    <path d="M 250,388 A 40 13 0 0 0 326,388" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.45" />
    <path d="M 270,392 A 20 6 0 0 0 306,392" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.3" />

  </g>

  <!-- Ambient Light Rays radiating from the fan dome -->
  <ellipse cx="288" cy="388" rx="65" ry="22" fill="#fffdf5" opacity="0.12" filter="url(#bloom)" />

</svg>
